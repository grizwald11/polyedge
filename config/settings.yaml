kalshi:
  host: "https://api.elections.kalshi.com/trade-api/v2"
  demo_host: "https://demo-api.kalshi.co/trade-api/v2"
  use_demo: false

scanning:
  interval_seconds: 300  # 5 minutes
  min_volume_24h: 100    # 100 contracts (Kalshi volumes are in contracts, not dollars)
  min_liquidity: 100     # 100 contracts minimum open interest
  max_markets: 200       # Max markets to track simultaneously
  target_categories:
    - "Politics"
    - "Geopolitics"
    - "Fed"
    - "AI"
    - "Tech"
    - "Culture"
    - "Earnings"
    - "Elections"
    - "Trump"
    - "Midterms"
    - "Economy"
  exclude_categories:
    - "Crypto Prices"  # Fee-enabled, HFT dominated
    - "Sports"         # Fees being rolled out

trading:
  mode: "paper"  # "paper" or "live"
  bankroll: 500.0
  max_position_pct: 0.05        # 5% of bankroll per position
  max_total_exposure_pct: 0.40  # 40% total
  max_correlated_exposure_pct: 0.20  # 20% in related markets
  min_edge_ai: 0.05             # 5% minimum edge for AI strategy
  min_edge_arb: 0.02            # 2% minimum edge for arbitrage
  min_edge_obvious_no: 0.01     # 1% minimum for obvious NO
  kelly_fraction: 0.5           # Half-Kelly
  prefer_maker: true            # Always use limit orders when possible
  daily_loss_limit_pct: 0.10    # 10% daily loss circuit breaker
  max_obvious_no_pct: 0.10      # Max 10% bankroll in obvious NO positions

claude:
  model_primary: "claude-opus-4-6"
  model_highstakes: "claude-opus-4-6"
  highstakes_threshold: 50.0    # Use Opus for positions > $50
  max_tokens: 2000
  temperature: 0.3              # Lower = more deterministic
  max_assessments_per_cycle: 10 # Don't burn API budget in one scan
  ensemble_weight: 0.85         # Claude weight in ensemble (market gets 1 - this)
  category_temperatures:        # Per-category temperature overrides
    Politics: 0.3
    "Fed/Macro": 0.3
    Geopolitics: 0.4
    "Tech/AI": 0.35
    Culture: 0.4
    Other: 0.35
  cross_check_enabled: false    # Dual-temperature cross-validation
  cross_check_top_n: 3          # Only cross-check top N markets by volume
  cross_check_temp_low: 0.2
  cross_check_temp_high: 0.5
  cross_check_disagreement_threshold: 0.15  # Skip if temps disagree by more than this

alerts:
  enabled: true
  imessage_enabled: false       # Enable after VAYU bridge is set up
  daily_report_time: "21:00"    # 9 PM PT daily summary

database:
  path: "data/markets.db"
  wal_mode: true

logging:
  level: "INFO"  # DEBUG for development
  file: "data/logs/polyedge.log"
