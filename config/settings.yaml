kalshi:
  host: "https://api.elections.kalshi.com/trade-api/v2"
  demo_host: "https://demo-api.kalshi.co/trade-api/v2"
  use_demo: false

polymarket:
  clob_host: "https://clob.polymarket.com"
  gamma_host: "https://gamma-api.polymarket.com"
  data_host: "https://data-api.polymarket.com"
  chain_id: 137
  signature_type: 1  # 0=EOA, 1=proxy/email wallet
  enabled: false     # Set to true when Polymarket wallet is funded

scanning:
  interval_seconds: 300  # 5 minutes
  min_volume_24h: 100    # 100 contracts (Kalshi volumes are in contracts, not dollars)
  min_liquidity: 100     # 100 contracts minimum open interest
  max_markets: 200       # Max markets to track simultaneously
  target_categories:
    - "Politics"
    - "Geopolitics"
    - "Fed"
    - "AI"
    - "Tech"
    - "Culture"
    - "Earnings"
    - "Elections"
    - "Trump"
    - "Midterms"
    - "Economy"
  exclude_categories:
    - "Crypto Prices"  # Fee-enabled, HFT dominated
    - "Sports"         # Fees being rolled out

trading:
  mode: "paper"  # "paper" or "live"
  bankroll: 5000.0
  max_position_pct: 0.05        # 5% of bankroll per position
  max_total_exposure_pct: 0.40  # 40% total exposure (design spec limit)
  max_correlated_exposure_pct: 0.20  # 20% in related markets
  min_edge_ai: 0.05             # 5% minimum edge for AI strategy
  min_edge_arb: 0.02            # 2% minimum edge for arbitrage
  min_edge_obvious_no: 0.01     # 1% minimum for obvious NO
  kelly_fraction: 0.5           # Half-Kelly
  prefer_maker: true            # Always use limit orders when possible
  daily_loss_limit_pct: 0.10    # 10% daily loss circuit breaker
  max_obvious_no_pct: 0.10      # Max 10% bankroll in obvious NO positions
  max_trades_per_cycle: 5       # Max trades per scan cycle (matches config.py default)

claude:
  model_primary: "claude-sonnet-4-6"
  model_highstakes: "claude-opus-4-6"
  highstakes_threshold: 50.0    # Use Opus for positions > $50
  max_tokens: 2000
  temperature: 0.3              # Lower = more deterministic
  max_assessments_per_cycle: 15 # AI strategy is top earner, assess more markets
  ensemble_weight: 0.85         # Claude weight in ensemble (market gets 1 - this)
  category_temperatures:        # Per-category temperature overrides
    Politics: 0.35              # Slightly raised from 0.3 to avoid overconfident point estimates
    "Fed/Macro": 0.3
    Geopolitics: 0.45           # Inherently uncertain; allow more exploration
    "Tech/AI": 0.35
    Culture: 0.45               # Inherently uncertain; allow more exploration
    Other: 0.35
  cross_check_enabled: true     # Dual-temperature cross-validation
  cross_check_top_n: 3          # Cross-check only top N edge signals (saves API time)
  cross_check_temp_low: 0.2
  cross_check_temp_high: 0.5
  cross_check_disagreement_threshold: 0.22  # Skip if temps disagree by more (relaxed from 0.15)

news:
  rss_feeds:
    - "https://feeds.reuters.com/reuters/topNews"
    - "https://feeds.reuters.com/reuters/businessNews"
  poll_interval_seconds: 120
  min_relevance: 0.3
  max_article_age_minutes: 30

whales:
  basket_path: "config/whale_basket.yaml"
  consensus_threshold: 0.8
  poll_interval_seconds: 600

execution:
  cycle_timeout_seconds: 600    # 10 min — cross-check + news research needs headroom

alerts:
  enabled: true
  imessage_enabled: false       # Enable after VAYU bridge is set up
  alert_on_trade: true
  alert_on_circuit_breaker: true
  daily_report_time: "21:00"    # 9 PM PT daily summary

database:
  path: "data/markets.db"
  wal_mode: true

logging:
  level: "INFO"  # DEBUG for development
  file: "data/logs/polyedge.log"
