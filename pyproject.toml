[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyedge"
version = "0.1.0"
description = "Multi-strategy AI-driven Kalshi trading platform"
requires-python = ">=3.9"
dependencies = [
    "kalshi-python>=2.1.4",
    "cryptography>=46.0",
    "anthropic>=0.86.0",
    "openai>=1.76.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0",
    "pydantic>=2.12",
    "python-dotenv>=1.2",
    "websockets>=16.0",
    "fastapi>=0.135",
    "uvicorn>=0.42",
    "jinja2>=3.1",
    "feedparser>=6.0",
    "ddgs>=9.11",
    "numpy>=2.2",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
]
vector = [
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require live API access",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
