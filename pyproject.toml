[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyedge"
version = "0.1.0"
description = "Multi-strategy AI-driven Polymarket trading platform"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require live API access",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
